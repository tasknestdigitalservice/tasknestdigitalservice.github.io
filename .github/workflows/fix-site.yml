name: fix-site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tasknest.me fixes
        run: |
          set -e
          git rm -q --ignore-unmatch [0-9]*-*.html [0-9]*-*.txt [0-9]*-*.xml
          find . -maxdepth 1 -name '*.html' -exec sed -i 's|https://tasknestdigitalservice\.github\.io/|https://www.tasknest.me/|g' {} +
          sed -i 's|https://tasknestdigitalservice\.github\.io/|https://www.tasknest.me/|g' robots.txt llms.txt
          for g in advanced-excel-formulas bihar-jati-niwas-aay-certificate excel-data-cleaning excel-data-entry-guide excel-data-formatting excel-mis-reporting google-review-management pdf-to-excel-conversion; do
            curl -fsSL "https://tasknestai.github.io/Tasknestai/$g.html" | sed -e 's|https://tasknestai\.github\.io/Tasknestai/|https://www.tasknest.me/|g' -e 's|TaskNest AI|TaskNest Digital Service|g' > "$g.html"
          done
          cat > /tmp/gs.html <<'HTMLEOF'
          <section class="py-24 bg-white relative z-10" id="guides">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="text-center mb-12">
          <h2 class="text-3xl md:text-4xl font-bold text-gray-900 mb-4">Guides &amp; articles</h2>
          <p class="text-lg text-gray-600 max-w-2xl mx-auto">Practical, in-depth guides on Excel, business data and Bihar certificates.</p>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
          <a class="service-card block bg-white rounded-2xl p-6 shadow-premium border border-gray-100 hover:shadow-premium-hover" href="advanced-excel-formulas.html">
          <h4 class="text-lg font-bold text-gray-900 mb-2">Advanced Excel Formulas for Business: XLOOKUP, SUMIFS and Safer Checks</h4>
          <p class="text-sm text-gray-500">Use XLOOKUP and SUMIFS for business calculations, understand formula errors, and test...</p>
          </a>
          <a class="service-card block bg-white rounded-2xl p-6 shadow-premium border border-gray-100 hover:shadow-premium-hover" href="bihar-jati-niwas-aay-certificate.html">
          <h4 class="text-lg font-bold text-gray-900 mb-2">बिहार जाति, निवास और आय प्रमाण पत्र online कैसे बनवाएँ</h4>
          <p class="text-sm text-gray-500">RTPS पोर्टल पर बिहार के जाति, निवास और आय प्रमाण पत्र का online आवेदन कैसे करें:...</p>
          </a>
          <a class="service-card block bg-white rounded-2xl p-6 shadow-premium border border-gray-100 hover:shadow-premium-hover" href="excel-data-cleaning.html">
          <h4 class="text-lg font-bold text-gray-900 mb-2">Excel Data Cleaning: A Practical Guide for Small Businesses</h4>
          <p class="text-sm text-gray-500">Clean business data in Excel safely: fix spaces, review duplicates, correct text...</p>
          </a>
          <a class="service-card block bg-white rounded-2xl p-6 shadow-premium border border-gray-100 hover:shadow-premium-hover" href="excel-data-entry-guide.html">
          <h4 class="text-lg font-bold text-gray-900 mb-2">Excel Data Entry: A Quality-Control Workflow for Growing Businesses</h4>
          <p class="text-sm text-gray-500">Plan accurate Excel data entry with clear fields, validation, source references,...</p>
          </a>
          <a class="service-card block bg-white rounded-2xl p-6 shadow-premium border border-gray-100 hover:shadow-premium-hover" href="excel-data-formatting.html">
          <h4 class="text-lg font-bold text-gray-900 mb-2">Excel Data Formatting: Build Clear, Consistent Business Spreadsheets</h4>
          <p class="text-sm text-gray-500">Format business spreadsheets with clear tables, readable dates and amounts, useful...</p>
          </a>
          <a class="service-card block bg-white rounded-2xl p-6 shadow-premium border border-gray-100 hover:shadow-premium-hover" href="excel-mis-reporting.html">
          <h4 class="text-lg font-bold text-gray-900 mb-2">MIS Reporting in Excel: Build Reports Managers Can Actually Use</h4>
          <p class="text-sm text-gray-500">Build practical Excel MIS reports with clear metrics, reliable source data,...</p>
          </a>
          <a class="service-card block bg-white rounded-2xl p-6 shadow-premium border border-gray-100 hover:shadow-premium-hover" href="google-review-management.html">
          <h4 class="text-lg font-bold text-gray-900 mb-2">Google Review Management: An Ethical Workflow for Growing Businesses</h4>
          <p class="text-sm text-gray-500">Manage Google reviews with neutral feedback requests, useful replies, privacy checks...</p>
          </a>
          <a class="service-card block bg-white rounded-2xl p-6 shadow-premium border border-gray-100 hover:shadow-premium-hover" href="pdf-to-excel-conversion.html">
          <h4 class="text-lg font-bold text-gray-900 mb-2">PDF to Excel Conversion: A Business Guide to Reliable Tables</h4>
          <p class="text-sm text-gray-500">Convert PDF tables into usable Excel data with source checks, supported import...</p>
          </a>
          </div>
          </div>
          </section>
          HTMLEOF
          awk 'BEGIN{m="<section class=\"py-16 bg-brand-dark\" id=\"partner\""; while((getline l < "/tmp/gs.html")>0) sec=sec l ORS} !done && (i=index($0,m)) {printf "%s%s%s\n", substr($0,1,i-1), sec, substr($0,i); done=1; next} {print}' index.html > index.new && mv index.new index.html
          grep -c 'id="guides"' index.html
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo '  <url><loc>https://www.tasknest.me/</loc><lastmod>2026-11-26</lastmod><priority>1.0</priority></url>'
            for f in $(ls *.html | grep -v -e '^404.html$' -e '^guide-template.html$' -e '^index.html$' | sort); do
              echo "  <url><loc>https://www.tasknest.me/$f</loc><lastmod>2026-11-26</lastmod><priority>0.8</priority></url>"
            done
            echo '</urlset>'
          } > sitemap.xml
          rm -f .github/workflows/fix-site.yml
          git config user.name "tasknestdigitalservice"
          git config user.email "tasknestai@gmail.com"
          git add -A
          git commit -m "Point canonical/OG/sitemap to www.tasknest.me, restore 8 guides, drop stray numbered uploads"
          git push origin HEAD:main
