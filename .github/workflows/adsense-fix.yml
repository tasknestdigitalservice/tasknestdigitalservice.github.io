name: AdSense readiness fixes
on:
  push:
    paths:
      - '.github/workflows/adsense-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: python3 .github/adsense-fix.py
      - name: Commit fixes and remove fixer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/adsense-fix.py .github/workflows/adsense-fix.yml
          git add -A
          git commit -m "AdSense fixes: privacy disclosure, disclaimer heading, Excel pricing text"
          git push
